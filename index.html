<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tumhare Liye Kuch Khaas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --dusk-1: #2b1f45;
  --dusk-2: #6b3f68;
  --dusk-3: #d97b6c;
  --ground: #3a2a3d;
  --wood: #7a4a30;
  --wood-dark: #5c3620;
  --cream: #fbf3e7;
  --accent: #e8a15b;
  --pink: #ff6f91;
  --font-display: 'Fraunces', serif;
  --font-body: 'Space Grotesk', sans-serif;
}
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body{ margin:0; height:100%; font-family: var(--font-body); color: var(--cream); overflow:hidden; }

.scene{
  position: relative;
  width: 100vw;
  height: 100dvh;
  background: linear-gradient(180deg, var(--dusk-1) 0%, var(--dusk-2) 55%, var(--dusk-3) 100%);
  overflow: hidden;
  display: none;
}
.scene.active{ display: block; }
.scene::before{
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 30% 10%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 50% 8%, rgba(255,255,255,.4), transparent);
  opacity: .8;
}
.ground{ position:absolute; bottom:0; left:0; right:0; height:24%; background: linear-gradient(180deg, var(--ground) 0%, #241a2e 100%); }
.ground::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background: rgba(232,161,91,.35); }

.board{ position:absolute; left:50%; bottom:22%; transform: translateX(-50%); z-index:3; display:flex; flex-direction:column; align-items:center; width:100%; padding:0 16px; }
.board .posts{ display:flex; gap:140px; }
.board .post{ width:14px; height:90px; background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%); border-radius:3px; }
.board .panel{
  margin-top:-18px;
  background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  border: 3px solid #3f2515;
  border-radius: 10px;
  padding: 28px 34px;
  min-width: 300px;
  max-width: 92vw;
  box-shadow: 0 18px 30px rgba(0,0,0,.35);
  text-align: center;
}
.board .panel h1, .board .panel h2{ font-family: var(--font-display); font-weight:600; margin:0 0 6px; color: var(--cream); letter-spacing:.5px; }
.board .panel p.sub{ margin:0 0 18px; color: rgba(251,243,231,.75); font-size:.92rem; }

.field{ text-align:left; margin-bottom:14px; }
.field label{ display:block; font-size:.8rem; margin-bottom:6px; color: rgba(251,243,231,.8); }
.field input{ width:100%; padding:10px 12px; border-radius:7px; border:1px solid rgba(251,243,231,.25); background: rgba(0,0,0,.25); color: var(--cream); font-family: var(--font-body); font-size:1rem; }
.field input:focus{ outline:none; border-color: var(--accent); }
.error{ color:#ffb4a8; font-size:.82rem; min-height:18px; margin-bottom:6px; }

button.cta{
  margin-top:6px; width:100%; padding:13px 18px; border:none; border-radius:7px;
  background: var(--accent); color:#2a1a10; font-family: var(--font-body); font-weight:600;
  font-size:1rem; cursor:pointer; transition: transform .15s ease, background .15s ease;
  touch-action: manipulation;
}
button.cta:hover{ background:#f0b476; transform: translateY(-1px); }
button.cta:active{ transform: translateY(0); }
button.cta.ghost{ background: transparent; border:2px solid rgba(251,243,231,.4); color: var(--cream); }
button.cta.ghost:hover{ background: rgba(251,243,231,.08); }

.btn-row{ display:flex; gap:10px; margin-top:6px; }
.btn-row button{ margin-top:0; }

.dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
.dots span{ width:6px; height:6px; border-radius:50%; background: rgba(251,243,231,.3); }
.dots span.active{ background: var(--accent); }

/* ---------------- CHARACTER RIG ---------------- */
.rig{
  position:absolute; bottom:24%; left:-260px; z-index:2;
  width:260px; height:240px;
}
.rig .char-wrap{
  position:absolute; right:6px; bottom:0; width:150px; height:250px;
  transform-origin: bottom center;
}
.rig .char-wrap svg{ width:100%; height:100%; overflow:visible; }
.leg-l,.leg-r,.arm-l,.arm-r{ transform-box: fill-box; transform-origin: top center; }
.rig.walking .leg-l{ animation: swingL .5s infinite ease-in-out; }
.rig.walking .leg-r{ animation: swingR .5s infinite ease-in-out; }
.rig.walking .arm-l{ animation: pullArmL .5s infinite ease-in-out; }
.rig.walking .arm-r{ animation: pullArmR .5s infinite ease-in-out; }
.rig.walking .body-bob{ animation: bob .25s infinite ease-in-out; }
.rig.walking .char-wrap{ animation: lean .5s infinite ease-in-out; }
@keyframes swingL{ 0%,100%{ transform: rotate(26deg);} 50%{ transform: rotate(-20deg);} }
@keyframes swingR{ 0%,100%{ transform: rotate(-20deg);} 50%{ transform: rotate(26deg);} }
@keyframes pullArmL{ 0%,100%{ transform: rotate(-30deg);} 50%{ transform: rotate(-8deg);} }
@keyframes pullArmR{ 0%,100%{ transform: rotate(-8deg);} 50%{ transform: rotate(-30deg);} }
@keyframes bob{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }
@keyframes lean{ 0%,100%{ transform: rotate(-9deg);} 50%{ transform: rotate(-13deg);} }

/* rope + dragged weight, trailing behind the character (to the left) */
.rig .drag{
  position:absolute; left:0; bottom:6px; width:190px; height:150px;
  transform-origin: right center;
}
.rig .drag svg{ width:100%; height:100%; overflow:visible; }
.rig.walking .rope-line{ animation: taut .5s infinite ease-in-out; }
.rig.walking .weight{ animation: jitter .18s infinite ease-in-out; }
@keyframes taut{ 0%,100%{ stroke-dasharray: 0; d: path('M12,86 Q70,120 168,58'); } 50%{ d: path('M12,82 Q70,60 168,58'); } }
@keyframes jitter{ 0%,100%{ transform: translate(0,0) rotate(-2deg);} 50%{ transform: translate(-2px,2px) rotate(2deg);} }
.rig .dust{ opacity:0; }
.rig.walking .dust{ animation: dustPuff .5s infinite ease-out; }
@keyframes dustPuff{ 0%{ opacity:.55; transform: scale(.4) translateY(0);} 100%{ opacity:0; transform: scale(1.3) translateY(-6px);} }

/* fallen state */
.rig.fallen .char-wrap{ animation:none; transform: rotate(78deg) translate(24px, 18px); transition: transform .5s cubic-bezier(.34,1.6,.64,1); }
.rig.fallen .leg-l,.rig.fallen .leg-r,.rig.fallen .arm-l,.rig.fallen .arm-r,.rig.fallen .body-bob{ animation:none !important; }
.rig.fallen .drag .rope-line{ animation:none; }
.rig.fallen .drag .weight{ animation:none; }

/* cloud bubble above fallen character */
.cloud-bubble{
  position:absolute; bottom:100%; left:50%; transform: translateX(-55%) scale(.7); margin-bottom:6px;
  opacity:0; pointer-events:none; transition: opacity .35s ease, transform .35s ease; z-index:4;
  width:230px;
}
.cloud-bubble.show{ opacity:1; transform: translateX(-55%) scale(1); }
.cloud-bubble svg{ width:100%; display:block; filter: drop-shadow(0 8px 14px rgba(0,0,0,.3)); }
.cloud-bubble .txt{
  position:absolute; inset:0 0 22% 0; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:0 26px; font-family: var(--font-display); font-weight:600;
  color:#4a3a2e; font-size:.98rem; line-height:1.25;
}

/* final propose panel - unique styling */
.panel.final-propose{
  background: linear-gradient(160deg, #ff8fa8 0%, #ff6f91 45%, #e8557a 100%);
  border: 3px solid #a83358;
  position: relative;
  overflow: visible;
}
.panel.final-propose::before{
  content:"💛"; position:absolute; top:-22px; left:-14px; font-size:1.6rem;
  animation: floaty 2.4s infinite ease-in-out;
}
.panel.final-propose::after{
  content:"✨"; position:absolute; bottom:-18px; right:-10px; font-size:1.6rem;
  animation: floaty 2.4s infinite ease-in-out reverse;
}
@keyframes floaty{ 0%,100%{ transform: translateY(0) rotate(0);} 50%{ transform: translateY(-8px) rotate(12deg);} }
.panel.final-propose h2{ font-size:1.5rem; color:#fff; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
.panel.final-propose p.sub{ color: rgba(255,255,255,.9); }

.celebrate{ display:none; }
.celebrate.show{ display:block; }
.hearts-burst{ position:absolute; inset:0; pointer-events:none; overflow:visible; }
.hearts-burst span{
  position:absolute; bottom:0; left:50%; font-size:1.4rem; opacity:0;
  animation: burst 1.6s ease-out forwards;
}
@keyframes burst{
  0%{ opacity:1; transform: translate(-50%,0) scale(.6); }
  100%{ opacity:0; transform: translate(calc(-50% + var(--dx,0px)), -160px) scale(1.2) rotate(var(--rot,0deg)); }
}

@media (max-width:520px){
  .board .posts{ gap:80px; }
  .board .panel{ padding:22px 18px; min-width:0; width:100%; }
  .board .panel h1, .board .panel h2{ font-size:1.2rem; }
  .rig{ width:190px; height:190px; }
  .rig .char-wrap{ width:112px; height:186px; }
  .rig .drag{ width:140px; height:112px; }
  .cloud-bubble{ width:180px; }
  .cloud-bubble .txt{ font-size:.82rem; padding:0 18px; }
}
@media (prefers-reduced-motion: reduce){
  .rig.walking .leg-l, .rig.walking .leg-r,
  .rig.walking .arm-l, .rig.walking .arm-r,
  .rig.walking .body-bob, .rig.walking .char-wrap,
  .rig.walking .rope-line, .rig.walking .weight, .rig.walking .dust{ animation:none !important; }
}
</style>
</head>
<body>

  <!-- SCREEN 1: LOGIN -->
  <div class="scene active" id="screen-login">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel">
        <h1>Hey Tum</h1>
        <p class="sub">ye sirf tumhare liye hai — dekhne ke liye sign in karo</p>
        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label for="username">Tumhara naam</label>
            <input id="username" type="text" placeholder="apna naam likho" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required>
          </div>
          <div class="error" id="errorMsg"></div>
          <button type="submit" class="cta">Andar aao</button>
        </form>
      </div>
    </div>
    <div class="rig" id="rig-login"></div>
  </div>

  <!-- SCREEN 2: DASHBOARD -->
  <div class="scene" id="screen-dashboard">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel">
        <h2 id="greeting">Tumhare Liye Kuch Khaas</h2>
        <p class="sub">chalte raho, aage sab achha hai</p>
        <button class="cta" id="dashboardNextBtn">Aage</button>
      </div>
    </div>
    <div class="rig" id="rig-dashboard"></div>
  </div>

  <!-- SCREEN 3: SLIDES -->
  <div class="scene" id="screen-slides">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel" id="slidePanel">
        <h2 id="slideText">Slide text</h2>
        <button class="cta" id="nextBtn">Aage</button>
        <div class="btn-row" id="finalBtnRow" style="display:none;">
          <button class="cta" id="yesBtn">Haan 💛</button>
          <button class="cta ghost" id="noBtn">Nahi</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="rig" id="rig-slides">
      <div class="cloud-bubble" id="cloudBubble">
        <svg viewBox="0 0 200 110" xmlns="http://www.w3.org/2000/svg">
          <g fill="#fdf6ec">
            <circle cx="50" cy="55" r="32"/>
            <circle cx="90" cy="35" r="38"/>
            <circle cx="135" cy="50" r="34"/>
            <circle cx="100" cy="65" r="36"/>
            <rect x="45" y="55" width="115" height="35" rx="17"/>
          </g>
          <path d="M78,88 L62,104 L92,90 Z" fill="#fdf6ec"/>
        </svg>
        <div class="txt">Please, YES kar do na 🥺</div>
      </div>
    </div>
  </div>

  <!-- SCREEN 4: CELEBRATION -->
  <div class="scene" id="screen-celebrate">
    <div class="ground"></div>
    <div class="board">
      <div class="panel final-propose">
        <div class="hearts-burst" id="heartsBurst"></div>
        <h2>Yayy! 🎉</h2>
        <p class="sub" id="celebrateText" style="color:#fff;">Usne haan bol diya!</p>
      </div>
    </div>
  </div>

<script>
/* ---------------- CONFIG ---------------- */
const FIXED_PASSWORD = "kritikapraveen";

// Apna kahani yahin likho (Hindi mein):
const slides = [
  "Suno, mujhe tumse kuch kehna hai.",
  "Koi badi ya darawani baat nahi hai, chinta mat karo.",
  "Bas itna hai ki... tumhare saath har din thoda behtar lagta hai.",
  "Tumhare saath sadharan pal bhi yaadgar ban jaate hain.",
  "Tumhara hasna, tumhara sunna — sab kuch mujhe achha lagta hai.",
  "Maine ye poori chalti-firti website sirf isliye banayi hai.",
  "Ye jo bojh khinch kar chal raha hai na — bilkul waise hi main tumhare liye kuch bhi karne ko taiyar hoon.",
  "Bas thoda aur chalna hai, mere saath raho.",
  "Bas pahunchne hi wale hain.",
  "Ab ghuma-phira kar nahi, seedha bol deta hoon.",
  "Mujhe tum sach mein bahut pasand ho — jitna maine kaha hai usse kahin zyada.",
  "Toh yahi sawaal hai... kya tum meri banoge?"
];

/* ---------------- CHARACTER + ROPE RIG ---------------- */
function rigMarkup(){
  return `
  <div class="drag">
    <svg viewBox="0 0 190 150" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="dust" cx="150" cy="132" rx="10" ry="5" fill="rgba(255,255,255,.5)"/>
      <ellipse class="dust" cx="130" cy="135" rx="7" ry="4" fill="rgba(255,255,255,.4)"/>
      <path class="rope-line" d="M12,86 Q70,110 168,58" stroke="#c9a876" stroke-width="5" fill="none" stroke-linecap="round"/>
      <g class="weight">
        <rect x="4" y="70" width="46" height="40" rx="8" fill="#8a5a34" stroke="#5c3620" stroke-width="3"/>
        <path d="M8,70 Q27,58 46,70" stroke="#5c3620" stroke-width="3" fill="none"/>
        <path d="M12,78 h30 M12,88 h30 M12,98 h30" stroke="#5c3620" stroke-width="2" opacity=".6"/>
      </g>
    </svg>
  </div>
  <div class="char-wrap">
    <svg viewBox="0 0 90 150" xmlns="http://www.w3.org/2000/svg">
      <g class="body-bob">
        <rect class="arm-l" x="30" y="55" width="9" height="42" rx="4.5" fill="#3b2e52"/>
        <rect class="leg-l" x="35" y="92" width="10" height="46" rx="5" fill="#241a2e"/>
        <rect class="leg-r" x="47" y="92" width="10" height="46" rx="5" fill="#2f2340"/>
        <rect x="30" y="50" width="30" height="48" rx="10" fill="#4d3d73"/>
        <rect class="arm-r" x="52" y="55" width="9" height="42" rx="4.5" fill="#5a4788"/>
        <rect x="41" y="40" width="8" height="12" fill="#e0a97c"/>
        <circle cx="45" cy="28" r="18" fill="#eab48a"/>
        <path d="M27 24c0-11 8-19 18-19s18 8 18 19c-3-3-8-5-12-4-2-4-6-5-9-3-4-2-9-1-11 3-2 1-3 2-4 4z" fill="#241a2e"/>
        <circle cx="27" cy="29" r="3" fill="#e0a97c"/>
        <circle cx="63" cy="29" r="3" fill="#e0a97c"/>
        <circle cx="39" cy="27" r="2.1" fill="#241a2e"/>
        <circle cx="51" cy="27" r="2.1" fill="#241a2e"/>
        <path d="M38 35c2.5 2.5 11.5 2.5 14 0" stroke="#8a4a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M33 20c2-2 6-3 8-1" stroke="#241a2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M49 19c2-2 6-1 8 1" stroke="#241a2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>`;
}
function mountRig(el){ el.insertAdjacentHTML('afterbegin', rigMarkup()); }

function walkAcross(el, onDone){
  const endX = window.innerWidth + 260;
  el.style.left = '-260px';
  el.classList.remove('fallen');
  el.classList.add('walking');
  requestAnimationFrame(() => {
    el.style.transition = 'left 4.4s linear';
    el.style.left = endX + 'px';
  });
  el.addEventListener('transitionend', function handler(){
    el.classList.remove('walking');
    el.removeEventListener('transitionend', handler);
    if (onDone) onDone();
  }, { once:true });
}
function walkForward(el, stepPx, onDone){
  const current = parseFloat(el.style.left || '0');
  const max = window.innerWidth - 220;
  const next = Math.min(current + stepPx, max);
  el.classList.remove('fallen');
  el.classList.add('walking');
  el.style.transition = 'left 1s ease-in-out';
  el.style.left = next + 'px';
  setTimeout(() => {
    el.classList.remove('walking');
    if (onDone) onDone();
  }, 1000);
}

/* ---------------- SCREEN SWITCHING ---------------- */
const screens = {
  login: document.getElementById('screen-login'),
  dashboard: document.getElementById('screen-dashboard'),
  slides: document.getElementById('screen-slides'),
  celebrate: document.getElementById('screen-celebrate')
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ---------------- LOGIN ---------------- */
const rigLogin = document.getElementById('rig-login');
mountRig(rigLogin);
walkAcross(rigLogin);

const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
let username = '';

loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const nameVal = document.getElementById('username').value.trim();
  const passVal = document.getElementById('password').value;

  if (!nameVal){ errorMsg.textContent = "Pehle apna naam to batao :)"; return; }
  if (passVal !== FIXED_PASSWORD){ errorMsg.textContent = "Ye sahi nahi hai — dobara try karo."; return; }

  username = nameVal;
  document.getElementById('greeting').textContent = 'Tumhare Liye Kuch Khaas, ' + username;
  showScreen('dashboard');

  const rigDash = document.getElementById('rig-dashboard');
  mountRig(rigDash);
  walkAcross(rigDash);
});

/* ---------------- DASHBOARD ---------------- */
document.getElementById('dashboardNextBtn').addEventListener('click', () => {
  showScreen('slides');
  startSlides();
});

/* ---------------- SLIDES ---------------- */
let slideIndex = 0;
const slideText = document.getElementById('slideText');
const slidePanel = document.getElementById('slidePanel');
const nextBtn = document.getElementById('nextBtn');
const finalBtnRow = document.getElementById('finalBtnRow');
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const dotsWrap = document.getElementById('dots');
const rigSlides = document.getElementById('rig-slides');
const cloudBubble = document.getElementById('cloudBubble');
let slidesStarted = false;

function stepPx(){ return (window.innerWidth - 340) / (slides.length - 1); }

function renderSlide(){
  const isFinal = (slideIndex === slides.length - 1);
  slideText.textContent = slides[slideIndex];
  [...dotsWrap.children].forEach((d,i) => d.classList.toggle('active', i === slideIndex));
  nextBtn.style.display = isFinal ? 'none' : 'block';
  finalBtnRow.style.display = isFinal ? 'flex' : 'none';
  slidePanel.classList.toggle('final-propose', isFinal);
}

function startSlides(){
  if (slidesStarted) return;
  slidesStarted = true;
  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    dotsWrap.appendChild(dot);
  });
  mountRig(rigSlides);
  rigSlides.style.left = '20px';
  renderSlide();
}

nextBtn.addEventListener('click', () => {
  if (slideIndex >= slides.length - 1) return;
  slideIndex++;
  walkForward(rigSlides, stepPx(), () => renderSlide());
  renderSlide();
});

function spawnHearts(){
  const wrap = document.getElementById('heartsBurst');
  wrap.innerHTML = '';
  const emojis = ['💛','💖','✨','💛','💗','✨','💛'];
  emojis.forEach((e,i) => {
    const span = document.createElement('span');
    span.textContent = e;
    span.style.setProperty('--dx', (Math.random()*160-80) + 'px');
    span.style.setProperty('--rot', (Math.random()*60-30) + 'deg');
    span.style.left = (10 + Math.random()*80) + '%';
    span.style.animationDelay = (i*0.08) + 's';
    wrap.appendChild(span);
  });
}

yesBtn.addEventListener('click', () => {
  document.getElementById('celebrateText').textContent = (username ? username + ', ' : '') + 'tumne haan bol diya! 💛';
  showScreen('celebrate');
  spawnHearts();
});

noBtn.addEventListener('click', () => {
  rigSlides.classList.remove('walking');
  rigSlides.classList.add('fallen');
  cloudBubble.classList.add('show');
  setTimeout(() => {
    cloudBubble.classList.remove('show');
    rigSlides.classList.remove('fallen');
  }, 2200);
});
</script>
</body>
</html>
