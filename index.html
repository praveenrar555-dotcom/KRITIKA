<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something For You</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap');

:root{
  --dusk-1: #2b1f45;
  --dusk-2: #6b3f68;
  --dusk-3: #d97b6c;
  --ground: #3a2a3d;
  --wood: #7a4a30;
  --wood-dark: #5c3620;
  --cream: #fbf3e7;
  --accent: #e8a15b;
  --font-display: 'Fraunces', serif;
  --font-body: 'Space Grotesk', sans-serif;
}
*{ box-sizing: border-box; }
html, body{ margin:0; height:100%; font-family: var(--font-body); color: var(--cream); overflow:hidden; }

.scene{
  position: relative;
  width: 100vw;
  height: 100vh;
  background: linear-gradient(180deg, var(--dusk-1) 0%, var(--dusk-2) 55%, var(--dusk-3) 100%);
  overflow: hidden;
  display: none;
}
.scene.active{ display: block; }
.scene::before{
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 30% 10%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 70% 15%, rgba(255,255,255,.5), transparent),
    radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 50% 8%, rgba(255,255,255,.4), transparent);
  opacity: .8;
}
.ground{ position:absolute; bottom:0; left:0; right:0; height:22%; background: linear-gradient(180deg, var(--ground) 0%, #241a2e 100%); }
.ground::before{ content:""; position:absolute; top:0; left:0; right:0; height:4px; background: rgba(232,161,91,.35); }

.board{ position:absolute; left:50%; bottom:20%; transform: translateX(-50%); z-index:1; display:flex; flex-direction:column; align-items:center; }
.board .posts{ display:flex; gap:140px; }
.board .post{ width:14px; height:90px; background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%); border-radius:3px; }
.board .panel{
  margin-top:-18px;
  background: linear-gradient(180deg, var(--wood) 0%, var(--wood-dark) 100%);
  border: 3px solid #3f2515;
  border-radius: 10px;
  padding: 28px 34px;
  min-width: 300px;
  max-width: 90vw;
  box-shadow: 0 18px 30px rgba(0,0,0,.35);
  text-align: center;
}
.board .panel h1, .board .panel h2{ font-family: var(--font-display); font-weight:600; margin:0 0 6px; color: var(--cream); letter-spacing:.5px; }
.board .panel p.sub{ margin:0 0 18px; color: rgba(251,243,231,.75); font-size:.92rem; }

.field{ text-align:left; margin-bottom:14px; }
.field label{ display:block; font-size:.8rem; margin-bottom:6px; color: rgba(251,243,231,.8); }
.field input{ width:100%; padding:10px 12px; border-radius:7px; border:1px solid rgba(251,243,231,.25); background: rgba(0,0,0,.25); color: var(--cream); font-family: var(--font-body); font-size:.95rem; }
.field input:focus{ outline:none; border-color: var(--accent); }
.error{ color:#ffb4a8; font-size:.82rem; min-height:18px; margin-bottom:6px; }

button.cta{
  margin-top:6px; width:100%; padding:11px 18px; border:none; border-radius:7px;
  background: var(--accent); color:#2a1a10; font-family: var(--font-body); font-weight:600;
  font-size:.95rem; cursor:pointer; transition: transform .15s ease, background .15s ease;
}
button.cta:hover{ background:#f0b476; transform: translateY(-1px); }
button.cta:active{ transform: translateY(0); }

.character{ position:absolute; bottom:20.5%; left:-160px; width:90px; height:150px; z-index:2; transform-origin: bottom center; }
.character svg{ width:100%; height:100%; overflow:visible; }
.leg-l,.leg-r,.arm-l,.arm-r{ transform-box: fill-box; transform-origin: top center; }
.character.walking .leg-l{ animation: swingL .55s infinite ease-in-out; }
.character.walking .leg-r{ animation: swingR .55s infinite ease-in-out; }
.character.walking .arm-l{ animation: swingR .55s infinite ease-in-out; }
.character.walking .arm-r{ animation: swingL .55s infinite ease-in-out; }
.character.walking .body-bob{ animation: bob .275s infinite ease-in-out; }
@keyframes swingL{ 0%,100%{ transform: rotate(22deg);} 50%{ transform: rotate(-22deg);} }
@keyframes swingR{ 0%,100%{ transform: rotate(-22deg);} 50%{ transform: rotate(22deg);} }
@keyframes bob{ 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} }

.dots{ display:flex; gap:6px; justify-content:center; margin-top:16px; }
.dots span{ width:6px; height:6px; border-radius:50%; background: rgba(251,243,231,.3); }
.dots span.active{ background: var(--accent); }

@media (max-width:480px){
  .board .posts{ gap:90px; }
  .board .panel{ padding:22px 20px; min-width:240px; }
  .character{ width:70px; height:116px; }
}
@media (prefers-reduced-motion: reduce){
  .character.walking .leg-l, .character.walking .leg-r,
  .character.walking .arm-l, .character.walking .arm-r,
  .character.walking .body-bob{ animation:none !important; }
}
</style>
</head>
<body>

  <!-- SCREEN 1: LOGIN -->
  <div class="scene active" id="screen-login">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel">
        <h1>Hey You</h1>
        <p class="sub">this one's just for you — sign in to see it</p>
        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label for="username">Your name</label>
            <input id="username" type="text" placeholder="type your name" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required>
          </div>
          <div class="error" id="errorMsg"></div>
          <button type="submit" class="cta">Come in</button>
        </form>
      </div>
    </div>
    <div class="character" id="character-login"></div>
  </div>

  <!-- SCREEN 2: DASHBOARD -->
  <div class="scene" id="screen-dashboard">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel">
        <h2 id="greeting">SOMETHING FOR YOU</h2>
        <p class="sub">keep going, it gets better</p>
        <button class="cta" id="dashboardNextBtn">Next</button>
      </div>
    </div>
    <div class="character" id="character-dashboard"></div>
  </div>

  <!-- SCREEN 3: SLIDES -->
  <div class="scene" id="screen-slides">
    <div class="ground"></div>
    <div class="board">
      <div class="posts"><div class="post"></div><div class="post"></div></div>
      <div class="panel">
        <h2 id="slideText">Slide text</h2>
        <button class="cta" id="nextBtn">Next</button>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div class="character" id="character-slides"></div>
  </div>

<script>
/* ---------------- CONFIG ---------------- */
const FIXED_PASSWORD = "kritikapraveen";

// Edit these 12 lines to write your own story:
const slides = [
  "So there's something I've been wanting to tell you.",
  "It's not a big secret or anything scary, don't worry.",
  "It's just... every day feels a little better with you in it.",
  "You have this way of making ordinary moments feel worth remembering.",
  "I notice it in the small things — how you laugh, how you listen.",
  "I made this whole silly walking-guy website just to tell you that.",
  "He's been walking this whole time because that's how far I'd go.",
  "A few more steps to go, stay with me.",
  "Almost there now.",
  "This is the part where I stop being subtle.",
  "I really, really like you — more than I've said out loud.",
  "So here it is: will you be mine? 💛"
];

/* ---------------- CHARACTER ---------------- */
function characterMarkup(){
  return `
  <svg viewBox="0 0 90 150" xmlns="http://www.w3.org/2000/svg">
    <g class="body-bob">
      <rect class="arm-l" x="30" y="55" width="9" height="42" rx="4.5" fill="#3b2e52"/>
      <rect class="leg-l" x="35" y="92" width="10" height="46" rx="5" fill="#241a2e"/>
      <rect class="leg-r" x="47" y="92" width="10" height="46" rx="5" fill="#2f2340"/>
      <rect x="30" y="50" width="30" height="48" rx="10" fill="#4d3d73"/>
      <rect class="arm-r" x="52" y="55" width="9" height="42" rx="4.5" fill="#5a4788"/>
      <rect x="41" y="40" width="8" height="12" fill="#e0a97c"/>
      <circle cx="45" cy="28" r="18" fill="#eab48a"/>
      <path d="M27 24c0-11 8-19 18-19s18 8 18 19c-3-3-8-5-12-4-2-4-6-5-9-3-4-2-9-1-11 3-2 1-3 2-4 4z" fill="#241a2e"/>
      <circle cx="27" cy="29" r="3" fill="#e0a97c"/>
      <circle cx="63" cy="29" r="3" fill="#e0a97c"/>
      <circle cx="39" cy="27" r="2.1" fill="#241a2e"/>
      <circle cx="51" cy="27" r="2.1" fill="#241a2e"/>
      <path d="M38 35c2.5 2.5 11.5 2.5 14 0" stroke="#8a4a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M33 20c2-2 6-3 8-1" stroke="#241a2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M49 19c2-2 6-1 8 1" stroke="#241a2e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
  </svg>`;
}
function mountCharacter(el){ el.innerHTML = characterMarkup(); }

function walkAcross(el, onDone){
  const endX = window.innerWidth + 160;
  el.style.left = '-160px';
  el.classList.add('walking');
  requestAnimationFrame(() => {
    el.style.transition = 'left 4.2s linear';
    el.style.left = endX + 'px';
  });
  el.addEventListener('transitionend', function handler(){
    el.classList.remove('walking');
    el.removeEventListener('transitionend', handler);
    if (onDone) onDone();
  }, { once:true });
}
function walkForward(el, stepPx){
  const current = parseFloat(el.style.left || '0');
  const max = window.innerWidth - 130;
  const next = Math.min(current + stepPx, max);
  el.classList.add('walking');
  el.style.transition = 'left .9s ease-in-out';
  el.style.left = next + 'px';
  setTimeout(() => el.classList.remove('walking'), 900);
}

/* ---------------- SCREEN SWITCHING ---------------- */
const screens = {
  login: document.getElementById('screen-login'),
  dashboard: document.getElementById('screen-dashboard'),
  slides: document.getElementById('screen-slides')
};
function showScreen(name){
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ---------------- LOGIN ---------------- */
const charLogin = document.getElementById('character-login');
mountCharacter(charLogin);
walkAcross(charLogin);

const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
let username = '';

loginForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const nameVal = document.getElementById('username').value.trim();
  const passVal = document.getElementById('password').value;

  if (!nameVal){ errorMsg.textContent = "Tell me your name first :)"; return; }
  if (passVal !== FIXED_PASSWORD){ errorMsg.textContent = "That's not quite it — try again."; return; }

  username = nameVal;
  document.getElementById('greeting').textContent = 'Something For You, ' + username;
  showScreen('dashboard');

  const charDash = document.getElementById('character-dashboard');
  mountCharacter(charDash);
  walkAcross(charDash);
});

/* ---------------- DASHBOARD ---------------- */
document.getElementById('dashboardNextBtn').addEventListener('click', () => {
  showScreen('slides');
  startSlides();
});

/* ---------------- SLIDES ---------------- */
let slideIndex = 0;
const slideText = document.getElementById('slideText');
const nextBtn = document.getElementById('nextBtn');
const dotsWrap = document.getElementById('dots');
const charSlides = document.getElementById('character-slides');
let slidesStarted = false;

function stepPx(){ return (window.innerWidth - 220) / (slides.length - 1); }

function renderSlide(){
  slideText.textContent = slides[slideIndex];
  [...dotsWrap.children].forEach((d,i) => d.classList.toggle('active', i === slideIndex));
  nextBtn.textContent = (slideIndex === slides.length - 1) ? 'Yes 💛' : 'Next';
}

function startSlides(){
  if (slidesStarted) return;
  slidesStarted = true;
  slides.forEach((_, i) => {
    const dot = document.createElement('span');
    if (i === 0) dot.classList.add('active');
    dotsWrap.appendChild(dot);
  });
  mountCharacter(charSlides);
  charSlides.style.left = '30px';
  renderSlide();
}

nextBtn.addEventListener('click', () => {
  if (slideIndex >= slides.length - 1){
    slideText.textContent = "That's a yes then. 🎉";
    nextBtn.style.display = 'none';
    return;
  }
  slideIndex++;
  walkForward(charSlides, stepPx());
  renderSlide();
});
</script>
</body>
</html>
